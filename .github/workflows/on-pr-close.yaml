name: Bot - On PR Close

# Runs on PR close (merged). Executes issue recommendation workflow:
# determines completed issue difficulty, finds next/same/fallback issues,
# and posts a recommendation comment via bot-on-pr-close.js.
on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  on-pr-close:
    runs-on: hiero-client-sdk-linux-large
    if: github.event.pull_request.merged == true

    concurrency:
      group: on-pr-close-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run PR Close Handler
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/bot-on-pr-close.js');
            await script({ github, context });

  on-pr-merged-conflict-check:
    runs-on: hiero-client-sdk-linux-large
    if: github.event.pull_request.merged == true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run Sibling Conflict Check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/scripts/bot-on-pr-merged.js');
            await script({ github, context });