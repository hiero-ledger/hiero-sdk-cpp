name: Bot - On CI Result

# ──────────────────────────────────────────────────────────────────────
# Workflow: Bot - On CI Result
#
# Purpose:
#   Runs every 10 minutes to reconcile open PRs against their latest
#   "PR Checks" workflow run. For each open PR:
#     - Looks up the latest "PR Checks" run by head SHA
#     - Updates the dashboard CI section
#     - On CI failure: force-swaps the status label to "needs revision"
#       and posts a one-time @mention notification (only on the clean
#       → failure transition; repeat failures stay quiet)
#
# Trigger choice:
#   Originally implemented as a `workflow_run` listener, which the
#   maintainers flagged as unsafe. This scheduled cron driver runs
#   entirely in the base-repo context, so no fork-PR input plane is
#   exposed and the security objection is resolved. Cost is up to ~10
#   minutes of latency before the dashboard reflects a CI result, which
#   is acceptable for a status indicator.
#
# Concurrency:
#   Serialized — only one tick runs at a time so two overlapping ticks
#   can't double-post the notification comment.
# ──────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes
  workflow_dispatch:          # Manual trigger for testing

defaults:
  run:
    shell: bash

permissions:
  contents: read         # Checkout repository for bot scripts
  pull-requests: write   # Update dashboard comment, swap status label
  issues: write          # Add/remove labels (PRs are issues for label APIs), post comments
  actions: read          # List workflow runs and jobs

jobs:
  reconcile:
    name: Reconcile CI Results
    runs-on: hiero-client-sdk-linux-large

    concurrency:
      group: on-ci-result
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Run Bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const bot = require('./.github/scripts/bot-on-ci-result.js');
            await bot({ github, context });
