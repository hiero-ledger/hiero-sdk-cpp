    - node_id is required and validated before execution
    - Clear distinction between:
      - node_id (integer identifier)
      - account_id (AccountId object)
    - Errors are deterministic and descriptive

    Flag:
    - Missing validation for node_id
    - Silent fallback behavior
    - Ambiguous identifier interpretation

    ----------------------------------------------------------
    REVIEW FOCUS 7 — PROTOBUF ALIGNMENT & SERIALIZATION
    ----------------------------------------------------------
    Verify strict alignment with Hedera protobuf definitions:

    - NodeCreateTransactionBody
    - NodeUpdateTransactionBody
    - NodeDeleteTransactionBody
    - AddressBookService RPC methods

    Verify:
