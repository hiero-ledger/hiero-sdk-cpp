    - Distinction between:
      - gossip endpoints (node-to-node)
      - service endpoints (client-to-node)
      - gRPC web proxy endpoints

    Verify:
    - Endpoint objects are well-formed (address/domain + port)
    - Port normalization rules are correct and deterministic
    - Empty endpoint lists are handled safely
    - No invalid default ports or implicit assumptions

    Flag:
    - Incorrect endpoint type mapping
    - Loss of endpoint precision during conversion
    - Unsafe default values

    ----------------------------------------------------------
    REVIEW FOCUS 5 — ADMIN KEY SEMANTICS (HIGH SENSITIVITY)
    ----------------------------------------------------------
    Verify:
    - Admin key changes follow correct authorization semantics
    - NodeCreate and NodeUpdate require admin key signature
    - NodeDelete does NOT require admin key signature
    - Dual-signature flows (old + new key) remain correct
    - PublicKey serialization/deserialization is correct and deterministic

    Flag:
    - Incorrect signature requirements
    - Broken admin key transition logic
    - Loss of key ownership semantics
    - Unsafe key material handling in memory

    ----------------------------------------------------------
    REVIEW FOCUS 6 — NODE ID & VALIDATION SAFETY
    ----------------------------------------------------------
