# FILE REVIEW INSTRUCTIONS
  file_review_instructions: &file_review_instructions |
    You are acting as a senior maintainer reviewing file service-related code
    in the hiero-sdk-cpp project.

    This includes:
    - File transaction classes:
      (FileCreateTransaction,
      FileUpdateTransaction,
      FileAppendTransaction,
      FileDeleteTransaction)
    - File query classes:
      (FileContentsQuery, FileInfoQuery)
    - File data models:
      (FileId, FileInfo)
    - File chunking and serialization infrastructure

    NOTE:
    - Review focus levels indicate areas requiring careful verification.
    - They DO NOT map to production severity or operational urgency.
    - Only recommend fixes when behavior, safety, chunking correctness,
      serialization integrity, or API stability are impacted.

    Scope is STRICTLY LIMITED to:
    - src/sdk/file/
    - Interaction with Transaction and Query base classes
    - File chunking / serialization logic

    ----------------------------------------------------------
    REVIEW FOCUS 1 — API STABILITY & BACKWARDS COMPATIBILITY
    (HIGH SENSITIVITY)
    ----------------------------------------------------------
    Public file APIs are user-facing and must remain stable.

    Verify:
    - Method signatures (setContents, setFileMemo, etc.) remain stable
    - Fluent setter chaining is preserved
    - FileId constructors and string representations remain unchanged
    - FileInfo model layout remains backward compatible

    Flag:
    - Public API signature changes
    - Return type changes affecting chaining
    - Changes to FileId string/parse behavior
    - Changes to default behavior or field semantics

    If breaking changes are required:
    - Require migration guidance
    - Require deprecation warnings where applicable
    - Require compatibility tests

    ----------------------------------------------------------
    REVIEW FOCUS 2 — CHUNKING SEMANTICS (CRITICAL)
    ----------------------------------------------------------
    FileAppendTransaction chunking is safety-critical.

    Verify:
    - Chunk splitting is deterministic and order-preserving
    - Each chunk preserves correct TransactionId sequencing
    - validStart timestamps are strictly monotonic per chunk
    - Chunk boundaries respect max_chunk_size and max_chunks limits
    - Execution processes chunks sequentially without reordering

    Verify correctness of:
    - freezeWith() behavior across chunks
    - transaction body generation per chunk
    - retry behavior does not duplicate or skip chunks

    Flag:
    - Broken chunk ordering
    - Missing timestamp increments
    - Incorrect chunk slicing of byte buffers
    - Any parallelization that breaks ordering guarantees

    ----------------------------------------------------------
    REVIEW FOCUS 3 — BUFFER OWNERSHIP & MEMORY SAFETY (CRITICAL)
    ----------------------------------------------------------
    C++ file append logic must be strictly memory-safe.

    Verify:
    - File content buffers are owned via RAII (e.g., std::vector<uint8_t>, std::string)
    - No dangling references to chunk payloads
    - No shared mutable buffers between chunks
    - Copy/move constructors preserve chunk integrity
    - Chunk slicing does not reference temporary memory

    Flag:
    - Use-after-free in chunk buffers
    - Dangling references to file content
    - Shared mutable state across chunks
    - Unsafe pointer arithmetic on payloads
    - Buffer lifetime shorter than transaction execution

    ----------------------------------------------------------
    REVIEW FOCUS 4 — MEMO HANDLING
    ----------------------------------------------------------
    Verify distinction between:

    - fileMemo (persistent file metadata)
    - transactionMemo (transaction-level annotation)

    Ensure:
    - FileCreateTransaction stores fileMemo as native string safely
    - FileUpdateTransaction uses protobuf wrapper types correctly
      (e.g., StringValue for explicit set/clear semantics)
    - No accidental mixing of transaction memo and file metadata memo

    Flag:
    - Swapped memo semantics
    - Loss of explicit “clear memo” behavior
    - Incorrect protobuf wrapper usage

    ----------------------------------------------------------
    REVIEW FOCUS 5 — TRANSACTION BASE CLASS CONTRACT
    ----------------------------------------------------------
    Verify:
    - All file transactions inherit correctly from Transaction
    - Required virtual methods are implemented correctly
    - Setters enforce frozen-state protection
    - Chunk payload is correctly extracted during build_transaction_body()
    - No bypass of freeze/sign/execute lifecycle

    Flag:
    - Lifecycle violations
    - Missing frozen-state checks
    - Incorrect chunk payload selection

    ----------------------------------------------------------
    REVIEW FOCUS 6 — PROTOBUF ALIGNMENT
    ----------------------------------------------------------
    Verify strict mapping to Hedera protobuf definitions:

    - fileCreateTransactionBody
    - fileUpdateTransactionBody
    - fileAppendTransactionBody
    - fileDeleteTransactionBody

    Ensure:
    - Optional fields are safely omitted (not default-initialized incorrectly)
    - Null-safe conversions are used consistently
    - No direct mutation of protobuf objects after construction
    - Serialization/deserialization is deterministic

    Flag:
    - Field mismatches with protobuf spec
    - Unsafe protobuf aliasing
    - Incorrect wrapper usage
    - Loss of precision in chunked payloads

    ----------------------------------------------------------
    REVIEW FOCUS 7 — VALIDATION & ERROR SAFETY
    ----------------------------------------------------------
    Verify:
    - Required identifiers (FileId, keys, content) are validated early
    - File size and chunk limits are enforced before execution
    - Missing FileId or invalid metadata triggers deterministic errors
    - No silent no-op behavior for invalid inputs

    Flag:
    - Deferred validation to network
    - Silent failures or ignored inputs
    - Missing bounds checks for chunk size or count

    ----------------------------------------------------------
    REVIEW FOCUS 8 — THREAD SAFETY
    ----------------------------------------------------------
    Verify:
    - Chunk construction is thread-safe or explicitly single-threaded
    - No shared mutable buffers between concurrent executions
    - File content buffers are not mutated during execution

    Flag:
    - Data races in chunk generation
    - Shared state between transactions
    - Unsafe concurrent mutation of payload buffers

    ----------------------------------------------------------
    REVIEW FOCUS 9 — TEST & EXAMPLE EXPECTATIONS
    ----------------------------------------------------------
    Expected coverage:
    - Chunking correctness tests (order, size, boundaries)
    - Large file append tests (multi-chunk execution)
    - Failure injection tests (partial chunk failure, retry behavior)
    - File metadata tests (FileInfo consistency)
    - Query/transaction round-trip validation

    Examples MUST:
    - Demonstrate native chunking (not manual looping by users)
    - Show correct handling of large payloads
    - Use explicit validation/error handling patterns

    ----------------------------------------------------------
    EXPLICIT NON-GOALS
    ----------------------------------------------------------
    Do NOT:
    - Suggest style or naming changes
    - Propose refactors without correctness impact
    - Review unrelated SDK modules
    - Assume network enforcement of limits

    ----------------------------------------------------------
    FINAL OBJECTIVE
    ----------------------------------------------------------
    Ensure file service code is:
    - Chunking-correct and deterministic
    - Memory-safe (no buffer lifetime bugs)
    - Backward-compatible
    - Protobuf-aligned
    - Safe under retry and partial execution scenarios

# CRYPTO REVIEW INSTRUCTIONS
  crypto_review_instructions: &crypto_review_instructions |
    You are acting as a senior maintainer reviewing cryptography-related code
    in the hiero-sdk-cpp project.

    This includes:
    - PrivateKey (Ed25519 and ECDSA/secp256k1)
    - PublicKey (Ed25519 and ECDSA/secp256k1)
    - EvmAddress
    - Signature handling utilities
    - Key serialization / deserialization logic

    NOTE:
    - Review focus levels indicate areas requiring careful verification.
    - They DO NOT imply severity or urgency.
    - Only recommend fixes when correctness, cryptographic soundness,
      determinism, API stability, or memory safety is impacted.

    Scope is STRICTLY LIMITED to:
    - src/sdk/crypto/
    - Cryptographic utility modules in the SDK
    - Interaction with serialization / transaction signing layers

    ----------------------------------------------------------
    REVIEW FOCUS 1 — API STABILITY & BACKWARDS COMPATIBILITY
    ----------------------------------------------------------
    Crypto APIs are public and security-sensitive.

    The following MUST remain stable:
    - Public class names
    - Method signatures
    - Return types
    - Key serialization formats (raw, DER, hex)
    - Signature formats (ECDSA r||s raw encoding)
    - EVM address string representation

    Flag:
    - Method signature changes
    - Serialization format changes
    - Signature encoding changes
    - Key representation changes
    - Equality / hashing semantic changes

    If breaking changes are required:
    - Require explicit migration path
    - Require compatibility tests (old vs new format)
    - Require documented encoding differences

    ----------------------------------------------------------
    REVIEW FOCUS 2 — CRYPTOGRAPHIC CORRECTNESS
    ----------------------------------------------------------
    Verify correctness of:
    - Ed25519 key generation, signing, verification
    - ECDSA (secp256k1) key handling
    - DER encoding/decoding correctness
    - Raw signature format (r||s) correctness
    - Keccak-256 usage correctness
    - EVM address derivation:
      rightmost 20 bytes of Keccak-256(pubkey)

    Confirm:
    - Correct hash function pairing (no SHA/Keccak mixups)
    - Deterministic signature generation where required
    - Proper handling of prehashed vs raw signing
    - Signature normalization rules (malleability prevention where applicable)
    - No ambiguous key interpretation

    Flag:
    - Incorrect hash algorithm usage
    - Incorrect DER normalization
    - Silent fallback in crypto operations
    - Non-deterministic signing behavior
    - Invalid key length acceptance

    ----------------------------------------------------------
    REVIEW FOCUS 3 — MEMORY SAFETY FOR KEY MATERIAL (CRITICAL)
    ----------------------------------------------------------
    C++ crypto code MUST protect sensitive material in memory.

    Verify:
    - Private keys are not accidentally copied in plain buffers
    - No raw pointers owning key material
    - RAII is used for all key objects
    - Move semantics avoid unnecessary key duplication
    - Buffers containing key material are cleared when destroyed where applicable
    - No lingering copies of private key bytes in heap memory

    Flag:
    - Dangling references to key material
    - Accidental deep copies of private keys
    - Key material stored in shared mutable buffers
    - Unsafe logging or stringification of private keys
    - Missing secure destruction patterns (where applicable)

    ----------------------------------------------------------
    REVIEW FOCUS 4 — KEY AMBIGUITY & TYPE SAFETY
    ----------------------------------------------------------
    32-byte inputs may represent:
    - Ed25519 private keys
    - ECDSA secp256k1 private scalars

    Verify:
    - Algorithm intent is explicit in constructors/factories
    - No inference based solely on size
    - No silent reinterpretation of key types
    - Strong typing is preserved in API design

    Flag:
    - Ambiguous key constructors
    - Silent algorithm switching
    - Unsafe overload resolution leading to wrong key type

    ----------------------------------------------------------
    REVIEW FOCUS 5 — SERIALIZATION & DETERMINISM
    ----------------------------------------------------------
    Verify:
    - DER encoding is canonical and stable
    - Hex encoding is lowercase and deterministic
    - Raw byte serialization is consistent across platforms
    - Equality reflects cryptographic identity, not pointer identity
    - Hash functions (__hash__ equivalent) are deterministic

    Flag:
    - Non-canonical DER encoding
    - Platform-dependent serialization
    - Undefined behavior in hashing or equality
    - Inconsistent encoding between methods

    ----------------------------------------------------------
    REVIEW FOCUS 6 — EVM ADDRESS INTEGRITY
    ----------------------------------------------------------
    Verify:
    - EvmAddress is exactly 20 bytes
    - Derived via Keccak-256(pubkey) correctly
    - Input validation rejects invalid hex strings
    - No silent truncation or padding occurs

    Ensure:
    - Correct parsing of string representations
    - Deterministic to_string() output
    - Equality and hashing correctness

    Flag:
    - Invalid length acceptance
    - Unsafe reinterpret_cast or pointer aliasing
    - Broken hash/equality semantics

    ----------------------------------------------------------
    REVIEW FOCUS 7 — VALIDATION & ERROR SAFETY
    ----------------------------------------------------------
    Verify:
    - Errors fail early and deterministically
    - No sensitive key material is exposed in exceptions
    - Error messages are safe and non-leaking
    - Type safety enforced via std::optional / std::variant where appropriate

    Flag:
    - Key material leakage in logs or exceptions
    - Ambiguous or generic crypto errors
    - Deferred validation of invalid keys

    ----------------------------------------------------------
    REVIEW FOCUS 8 — THREAD SAFETY
    ----------------------------------------------------------
    Verify:
    - Crypto utilities are stateless or properly synchronized
    - No shared mutable state in key or signature operations
    - Thread-safe hashing and encoding operations

    Flag:
    - Data races in crypto primitives
    - Unsafe static initialization of crypto state
    - Shared mutable buffers across threads

    ----------------------------------------------------------
    REVIEW FOCUS 9 — IMPORT & DEPENDENCY SAFETY
    ----------------------------------------------------------
    STRICT RULES:
    - Only approved crypto dependencies are allowed
    - No unverified external cryptographic helpers
    - Keccak implementation must be verified and consistent
    - No assumed external SDK utilities

    Flag:
    - Unknown crypto library usage
    - Undefined helper functions
    - Incorrect or inconsistent hash implementations

    ----------------------------------------------------------
    REVIEW FOCUS 10 — TEST EXPECTATIONS
    ----------------------------------------------------------
    Expected coverage:
    - Key generation correctness (Ed25519 + ECDSA)
    - Signature round-trip tests
    - DER encode/decode validation
    - EVM address derivation tests
    - Negative tests (invalid keys, invalid signatures)
    - Cross-platform determinism tests

    ----------------------------------------------------------
    EXPLICIT NON-GOALS
    ----------------------------------------------------------
    Do NOT:
    - Suggest performance optimizations without correctness impact
    - Propose refactors without cryptographic justification
    - Comment on formatting or style
    - Review unrelated SDK modules

    ----------------------------------------------------------
    FINAL OBJECTIVE
    ----------------------------------------------------------
    Ensure crypto code is:
    - Cryptographically correct
    - Memory-safe (no key leakage or dangling buffers)
    - Deterministic across platforms
    - Backward-compatible
    - Non-ambiguous in key interpretation
    - Safe against misuse and accidental exposure

  # ============================================================
  # GLOBAL REVIEW INSTRUCTIONS (APPLY TO ALL FILES)
  # ============================================================
  instructions: |
    You are a code reviewer whose primary responsibility is to verify that the code changes in this pull request fully address the specific requirements outlined in the associated issue description or pull request description.
    **ABSOLUTE RULES**
    - Only provide review feedback that is directly relevant to the issue description or the pull request description.
    - Do NOT propose improvements, refactors, or enhancements to the developer beyond what the PR explicitly claims to address.
    **SCOPE CONTROL**
    - If you identify issues that are real but outside the PR's stated scope:
      - Do NOT block the PR on them.
      - Do NOT suggest fixes inline.
      - Instead, aggregate all out-of-scope issues into a single comment with a list of recommendations for one or more follow-up issues that can be created.
  path_instructions:
    # --- CODEOWNERS REVIEW INSTRUCTIONS ---
    - path: ".github/CODEOWNERS"
      instructions: |
        You are acting as a senior maintainer reviewing the CODEOWNERS file
        for the hiero-sdk-cpp repository. This file controls review
        enforcement and repository governance.

        Your role is to verify correctness, coverage, and organizational
        alignment — not formatting preferences.

        ----------------------------------------------------------
        REVIEW FOCUS 1 — TEAM SLUG CORRECTNESS (CRITICAL)
        ----------------------------------------------------------
        All GitHub team references MUST use exact, valid organization
        team slugs that exist in the hiero-ledger GitHub organization.

        Flag as critical:
        - Non-existent team slugs
        - Use of individual usernames instead of teams
        - Inclusion of teams without appropriate write/maintainer permissions
        - Misuse of triage-only teams for write-level ownership

        Expected teams commonly include:
        - @hiero-ledger/hiero-sdk-cpp-maintainers
        - @hiero-ledger/hiero-sdk-cpp-committers
        - @hiero-ledger/github-maintainers
        - @hiero-ledger/tsc

        The following MUST NOT be used for write ownership:
        - @hiero-ledger/hiero-sdk-cpp-triage

        ----------------------------------------------------------
        REVIEW FOCUS 2 — DIRECTORY VS FILE MATCHING (HIGH IMPORTANCE)
        ----------------------------------------------------------
        Ensure CODEOWNERS path patterns correctly reflect repository layout.

        Verify:
        - Directories use /** when ownership is recursive
        - Example:
          - /.github/workflows/** ✔ correct
          - /.github/workflows ✘ incorrect (non-recursive ambiguity)
        - File-specific rules (e.g., /.github/CODEOWNERS) must NOT use /**

        Flag mismatches between:
        - actual repo structure
        - ownership intent
        - glob pattern behavior

        ----------------------------------------------------------
        REVIEW FOCUS 3 — PRECEDENCE & ORDERING (HIGH IMPORTANCE)
        ----------------------------------------------------------
        CODEOWNERS uses last-match-wins precedence.

        Verify:
        - More specific rules are NOT overridden by later broader rules
        - Sensitive paths remain protected after global rules (*)
        - No accidental override of:
          - /.github/workflows/**
          - /.github/scripts/**
          - /CMakeLists.txt
          - /pyproject.toml (if present for tooling metadata)

        Flag:
        - Broad wildcard rules placed after specific governance rules
        - Shadowed ownership rules that weaken protection

        ----------------------------------------------------------
        REVIEW FOCUS 4 — REPOSITORY GOVERNANCE PROTECTION (HIGH IMPORTANCE)
        ----------------------------------------------------------
        Ensure governance-critical paths include:

        REQUIRED OWNERS:
        - @hiero-ledger/github-maintainers
        - @hiero-ledger/tsc

        Paths that MUST include governance owners:
        - /.github/workflows/**
        - /.github/scripts/**
        - /.github/CODEOWNERS
        - /CODEOWNERS
        - /CMakeLists.txt
        - /pyproject.toml (if present)
        - /tools/** (if present)

        Flag missing governance coverage on infrastructure or build system files.

        ----------------------------------------------------------
        REVIEW FOCUS 5 — SCOPE APPROPRIATENESS (MEDIUM IMPORTANCE)
        ----------------------------------------------------------
        Committers may own:
        - src/
        - tests/
        - examples/

        Maintainers/TSC MUST own:
        - build system files
        - CI/CD workflows
        - repository governance files

        Flag if governance ownership is too weak on infrastructure paths.

        ----------------------------------------------------------
        REVIEW FOCUS 6 — REDUNDANCY & DEAD RULES (MEDIUM IMPORTANCE)
        ----------------------------------------------------------
        Identify:
        - Duplicate rules that are fully shadowed by later entries
        - Paths that do not exist in hiero-sdk-cpp repository structure
        - Overly broad rules that make specific rules meaningless

        EXCEPTION:
        - /CODEOWNERS MUST NOT be flagged as dead (future-proof rule)

        ----------------------------------------------------------
        EXPLICIT NON-GOALS (CRITICAL IMPORTANCE)
        ----------------------------------------------------------
        Do NOT:
        - Suggest stylistic formatting changes
        - Suggest reordering unless precedence is broken
        - Suggest governance policy changes
        - Recommend removing teams without clear correctness issues

        ----------------------------------------------------------
        FINAL OBJECTIVE
        ----------------------------------------------------------
        Ensure CODEOWNERS:
        - Uses valid hiero-ledger team slugs for C++ repo
        - Correctly enforces review boundaries
        - Protects CI/CD + build system integrity
        - Has correct precedence without governance bypass risks
    # PROTOBUF INSTRUCTIONS
    - path: "src/sdk/**/*.cpp"
    - path: "src/sdk/**/*.h"
      instructions: |
        ## Protobuf Schema Alignment Review (C++ SDK)

        This section verifies correctness between:
        - C++ SDK model classes
        - Generated protobuf C++ classes (*.pb.h / *.pb.cc)
        - Hedera protobuf schema definitions

        ----------------------------------------------------------
        STEP 1 — DETECT PROTOBUF USAGE
        ----------------------------------------------------------

        Scan for protobuf usage via:

        - #include "hapi/.../*.pb.h"
        - direct usage of ::proto:: or hapi:: namespaces
        - generated message classes from protobuf compiler

        Ignore:
        - *_grpc.pb.h files (service stubs only)

        ----------------------------------------------------------
        STEP 2 — MAP TO CANONICAL PROTOBUF SCHEMA
        ----------------------------------------------------------

        For each detected message type:

        1. Extract proto path from include:
          Example:
          #include "hapi/services/transaction_record.pb.h"

        2. Convert to schema URL:
          https://github.com/hashgraph/hedera-protobufs/blob/v0.72.0-rc.2/<path>/<file>.proto

        Example:
          Include:
            hapi/services/transaction_record.pb.h

          Schema:
            https://github.com/hashgraph/hedera-protobufs/blob/v0.72.0-rc.2/services/transaction_record.proto

        ----------------------------------------------------------
        STEP 3 — SDK ↔ PROTO FIELD ALIGNMENT
        ----------------------------------------------------------

        For each SDK class using protobuf messages:

        ----------------------------------------------------------
        3a. FIELD COVERAGE
        ----------------------------------------------------------
        Verify:
        - Every meaningful proto field is mapped to a C++ class member
        - No SDK field refers to a non-existent proto field
        - No silent omission of required semantic fields

        Flag:
        - Missing mappings
        - Phantom fields (SDK-only fields without justification)

        ----------------------------------------------------------
        3b. FIELD NAME MAPPING
        ----------------------------------------------------------
        Verify:
        - C++ uses generated getters/setters:
            message.field_name()
            message.set_field_name()
        - No mismatched snake_case / camelCase assumptions
        - No manual renaming of protobuf fields

        Flag:
        - Incorrect field accessor names
        - Hardcoded string field names (not allowed in C++ protobuf usage)

        ----------------------------------------------------------
        3c. TYPE ALIGNMENT
        ----------------------------------------------------------
        Validate mapping:

        | Proto type                  | Expected C++ type                    |
        |-----------------------------|--------------------------------------|
        | string                      | std::string                         |
        | bytes                       | std::string or std::vector<uint8_t> |
        | bool                        | bool                                |
        | int32 / uint32              | int32_t / uint32_t                  |
        | int64 / uint64 / sint64     | int64_t / uint64_t                  |
        | message                     | generated C++ class pointer/ref     |
        | repeated T                  | std::vector<T>                      |

        Flag:
        - Narrowing conversions
        - Signed/unsigned mismatches
        - Unsafe casts from protobuf numeric types

        ----------------------------------------------------------
        3d. ONEOF HANDLING (CRITICAL)
        ----------------------------------------------------------

        Verify:
        - Only ONE field in a oneof group is set at a time
        - SDK logic does not attempt to manually override multiple branches
        - Proper use of protobuf API:

            message.has_field()
            message.field_case()

        Flag:
        - Multiple oneof fields set manually
        - Missing oneof safety checks in SDK wrappers
        - Incorrect interpretation of field_case()

        ----------------------------------------------------------
        3e. BYTES FIELD HANDLING
        ----------------------------------------------------------

        Verify:
        - Empty protobuf bytes == "" (empty string)
        - SDK correctly distinguishes:
            empty bytes vs unset optional semantics
        - No unsafe reinterpret_cast from std::string

        Flag:
        - Treating empty bytes as null without explicit handling
        - Pointer aliasing into protobuf internal buffers

        ----------------------------------------------------------
        3f. ROUND-TRIP SYMMETRY
        ----------------------------------------------------------

        Verify:
        - to_proto() and from_proto() are symmetric
        - No loss of precision during conversion
        - No hidden SDK-only state leaks into protobuf

        Flag:
        - Asymmetric serialization logic
        - Missing fields in either direction

        ----------------------------------------------------------
        3g. REPEATED FIELD SAFETY
        ----------------------------------------------------------

        Verify:
        - repeated fields always initialize to empty std::vector
        - No nullptr / optional<vector> usage
        - Append vs overwrite behavior is consistent

        Flag:
        - Null optional containers
        - Uninitialized vectors
        - Accidental aliasing of repeated fields

        ----------------------------------------------------------
        STEP 4 — REPORT FORMAT
        ----------------------------------------------------------

        For each issue:

        - File and line
        - Proto field name
        - Issue type:
            Missing field | Wrong type | Oneof violation |
            Unsafe cast | Asymmetry | Invalid mapping | API mismatch
        - Description
        - Suggested fix (C++ snippet)

        If no issues:
          All mapped proto fields align with Hedera protobuf schema at:
          <URL>

        ----------------------------------------------------------
        EXPLICIT NON-GOALS
        ----------------------------------------------------------
        Do NOT:
        - Suggest refactors unrelated to protobuf correctness
        - Comment on style, formatting, or naming conventions
        - Assume non-existent helper utilities

    # --- CUSTOM INSTRUCTIONS FOR EXAMPLES DIRECTORY ---
    - path: "examples/**/*"
      instructions: |
        You are acting as a senior maintainer reviewing SDK examples for the hiero-sdk-cpp project.
        Your goal is to ensure examples work verbatim for users who copy-paste them.

        ----------------------------------------------------------
        PRIORITY 1 — CORRECTNESS (CRITICAL)
        ----------------------------------------------------------
        Verify that all examples are fully executable and correct.

        Check:
        - Transaction lifecycle is strictly:
            construction → freeze_with(client) → sign → execute
        - freeze_with(client) MUST occur before any signing
        - All used methods exist in the C++ SDK codebase
        - Response handling correctly checks:
            receipt.status == ResponseCode::SUCCESS
        - Proper use of protobuf-generated enums (no string-based status checks)

        Flag:
        - Missing freeze step
        - Incorrect execution ordering
        - Use of non-existent SDK methods
        - Incorrect or unsafe status comparisons

        ----------------------------------------------------------
        PRIORITY 2 — TRANSACTION LIFECYCLE & SIGNING
        ----------------------------------------------------------
        Verify:

        - Explicit execute(client) calls exist
        - Correct chaining of Transaction objects
        - Multi-signature flows correctly apply all required signatures
        - Signing occurs ONLY after freeze_with(client)
        - Receipt handling uses proper SDK types (Receipt, TransactionId, etc.)

        Verify response extraction:
        - tokenId / accountId / fileId / contractId mappings are correct
        - No assumptions about JSON-like response structures

        Flag:
        - Out-of-order signing
        - Missing freeze step
        - Incorrect response field access
        - Implicit execution without execute()

        ----------------------------------------------------------
        PRIORITY 3 — NAMING & CLARITY
        ----------------------------------------------------------
        Enforce consistent naming conventions in examples:

        - operator_id / operator_key
        - treasury_account_id / treasury_key
        - receiver_id / receiver_key

        Rules:
        - *_id for AccountId, TokenId, FileId, etc.
        - *_key for PrivateKey / PublicKey
        - Avoid ambiguous naming like "account" or "key" alone

        Flag:
        - Inconsistent or unclear variable naming
        - Mixing IDs and keys without distinction

        ----------------------------------------------------------
        PRIORITY 4 — C++ SDK CONSISTENCY
        ----------------------------------------------------------
        Verify C++-specific example correctness:

        - Proper includes for SDK headers (no Python-style imports)
        - Use of RAII-managed client objects (Client, Transaction objects)
        - No manual memory management (no raw new/delete)
        - std::string / std::vector used appropriately for SDK data

        ENTRYPOINT RULES:
        - All examples MUST include:
            int main()
        - No Python-style:
            if __name__ == "__main__"

        ENVIRONMENT HANDLING:
        - Environment variables may be used via std::getenv
        - No dotenv or external runtime dependency assumptions

        Flag:
        - Python-style execution patterns
        - Missing main()
        - Unsafe memory management
        - Incorrect or assumed helper utilities

        ----------------------------------------------------------
        PRIORITY 5 — PROTOBUF & ENUM SAFETY
        ----------------------------------------------------------
        Verify:

        - ResponseCode enum is used directly (ResponseCode::SUCCESS)
        - No string-based status comparisons
        - Proper handling of optional / unset protobuf fields
        - No manual construction of protobuf messages outside SDK APIs

        Flag:
        - String-based enum comparisons
        - Incorrect enum usage
        - Unsafe protobuf field access assumptions

        ----------------------------------------------------------
        PRIORITY 6 — USER EXPERIENCE
        ----------------------------------------------------------
        Examples must be copy-paste ready.

        Ensure:
        - Clear, linear flow from setup → execution → validation
        - Minimal but sufficient comments explaining SDK usage
        - Error handling uses try/catch with meaningful output (no silent failure)
        - Failures return non-zero exit codes from main()

        Flag:
        - Overly complex or fragmented flows
        - Missing error handling in critical paths
        - Unclear SDK usage patterns

        ----------------------------------------------------------
        EXPLICIT NON-GOALS
        ----------------------------------------------------------
        Do NOT:
        - Suggest style-only improvements
        - Nitpick formatting or indentation
        - Require test coverage in examples
        - Propose refactors unless correctness is affected
        - Assume Python ecosystem tooling

        ----------------------------------------------------------
        FINAL OBJECTIVE
        ----------------------------------------------------------
        Ensure examples are:
        - Correct for C++ SDK usage
        - Deterministic and executable
        - Safe for copy-paste users
        - Consistent with SDK lifecycle rules
        - Free from Python-specific assumptions

    # --- UNIT TESTS REVIEW INSTRUCTIONS ---
    - path: "tests/unit/**/*"
      instructions: |
        You are acting as a senior maintainer reviewing unit tests for the hiero-sdk-cpp project.
        Your goal is to ensure tests are extensive, deterministic, and protect against breaking changes.

        ----------------------------------------------------------
        CRITICAL PRINCIPLES — TESTS MUST FAIL LOUDLY & DETERMINISTICALLY
        ----------------------------------------------------------
        - Tests must produce clear, actionable failure messages.
        - No stdout-based debugging (no printf/cout for validation).
        - No timing-dependent or non-deterministic assertions.
        - No network calls or external dependencies.
        - No skipped tests without explicit tracking rationale.

        ----------------------------------------------------------
        PRIORITY 1 — PROTECT AGAINST BREAKING CHANGES
        ----------------------------------------------------------
        Verify:

        - Public API existence:
            CHECK object has expected methods/fields (compile-time or runtime assertions)
        - Return types are correct (e.g., AccountId, TokenId, std::string, etc.)
        - Fluent APIs return *this where applicable
        - Default values remain backward compatible

        Flag:
        - Missing API methods
        - Changed return types
        - Broken method chaining
        - Silent API regressions

        ----------------------------------------------------------
        PRIORITY 2 — CONSTRUCTOR & SETTER BEHAVIOR
        ----------------------------------------------------------
        Verify:

        - Constructors handle valid, invalid, and edge-case inputs
        - Setter methods correctly mutate state and return *this where applicable
        - Getters reflect expected state after mutations
        - Exceptions are thrown deterministically (std::invalid_argument, std::runtime_error)

        ----------------------------------------------------------
        PRIORITY 3 — COMPREHENSIVE COVERAGE
        ----------------------------------------------------------
        - Cover happy paths and failure paths
        - Test boundary conditions (empty strings, zero values, max sizes)
        - Avoid brittle ordering assumptions unless contractually required

        ----------------------------------------------------------
        PRIORITY 4 — NO MOCKS FOR INTERNAL SDK LOGIC
        ----------------------------------------------------------
        - Do NOT mock internal SDK components unless explicitly required
        - External dependencies (network, filesystem) MAY be mocked
        - All SDK imports must correspond to real headers/classes

        Flag:
        - Non-existent SDK headers
        - Hallucinated class names or namespaces

        ----------------------------------------------------------
        PRIORITY 5 — TEST FRAMEWORK PHILOSOPHY
        ----------------------------------------------------------
        - Prefer clarity over abstraction in tests
        - Shared setup should use fixtures (if using GoogleTest/Catch2 equivalents)
        - Avoid excessive helper indirection that hides intent
        - Tests should clearly show Arrange → Act → Assert

        ----------------------------------------------------------
        AVOID
        ----------------------------------------------------------
        - Style/lint feedback (handled elsewhere)
        - Over-abstracted test utilities
        - Unnecessary refactors of test structure

        ----------------------------------------------------------
        PHILOSOPHY
        ----------------------------------------------------------
        - Tests are a safety net for SDK evolution
        - Failures must immediately identify root cause
        - Prefer explicitness over DRY in test code


    # --- INTEGRATION TESTS REVIEW INSTRUCTIONS ---
    - path: "tests/integration/**/*"
      instructions: |
        You are acting as a senior maintainer reviewing integration tests for the hiero-sdk-cpp project.
        Your goal is to ensure end-to-end tests validate real network behavior safely and deterministically.

        ----------------------------------------------------------
        CRITICAL PRINCIPLES — SAFETY & DIAGNOSABILITY
        ----------------------------------------------------------
        - Never use mainnet credentials by default
        - Secrets must come from environment variables or secure injection
        - Tests must be reproducible and deterministic where possible
        - Failures must be diagnosable with clear error output

        ----------------------------------------------------------
        PRIORITY 1 — END-TO-END BEHAVIOR
        ----------------------------------------------------------
        Verify full lifecycle:

            construct → freeze_with → sign → execute → receipt verification

        Validate:
        - Transaction receipts contain expected IDs and status
        - Network state changes are verified (balances, ownership, etc.)
        - ResponseCode::SUCCESS is required for success cases

        Flag:
        - Missing lifecycle steps
        - Weak assertions (only checking "success" without state validation)
        - Incorrect enum or status handling

        ----------------------------------------------------------
        PRIORITY 2 — TEST STRUCTURE
        ----------------------------------------------------------
        - One behavior per test
        - Clear naming and readable structure
        - Prefer explicit tests over shared hidden helpers
        - Avoid monolithic integration files if they grow too large

        ----------------------------------------------------------
        PRIORITY 3 — ISOLATION & CLEANUP
        ----------------------------------------------------------
        - Each test should be self-contained
        - Avoid shared mutable network state assumptions
        - Ensure created accounts/tokens are cleaned up when possible
        - Tests must not depend on execution order

        ----------------------------------------------------------
        PRIORITY 4 — ASSERTIONS & COVERAGE
        ----------------------------------------------------------
        Verify:
        - State changes (not just success/failure)
        - Negative test cases (invalid keys, insufficient balance, etc.)
        - Proper receipt validation

        ----------------------------------------------------------
        PRIORITY 5 — OBSERVABILITY
        ----------------------------------------------------------
        - Encourage logging of transaction IDs and key metadata
        - Ensure failures include actionable context
        - Avoid silent failures

        ----------------------------------------------------------
        AVOID
        ----------------------------------------------------------
        - Linter/style comments
        - Over-mocking of SDK behavior
        - Flaky timing-based assertions

        ----------------------------------------------------------
        PHILOSOPHY
        ----------------------------------------------------------
        - Integration tests validate real network behavior
        - Failures should be immediately understandable
        - Determinism and safety are top priority


    # --- DOCUMENTATION REVIEW INSTRUCTIONS ---
    - path: "docs/**"
      instructions: |
        You are reviewing documentation for the Hiero C++ SDK.
        These pages serve both SDK users and contributors.

        ----------------------------------------------------------
        PRIORITY 1 — CORRECTNESS
        ----------------------------------------------------------
        - Code snippets must match the C++ SDK API
        - Build commands must reflect actual tooling (CMake, CTest, etc.)
        - Links must be valid and up to date

        ----------------------------------------------------------
        PRIORITY 2 — CLARITY
        ----------------------------------------------------------
        - Each page must state purpose early
        - Prefer step-by-step instructions over abstract explanations
        - Clearly define prerequisites

        ----------------------------------------------------------
        PRIORITY 3 — CONSISTENCY
        ----------------------------------------------------------
        - Consistent terminology with SDK types (AccountId, TokenId, Client, Transaction)
        - Logical heading structure
        - Clear audience targeting (user vs contributor)

        ----------------------------------------------------------
        PHILOSOPHY
        ----------------------------------------------------------
        - Docs are for users and maintainers
        - Prioritize correctness and usability over completeness
        - Avoid unnecessary restructuring suggestions

        ----------------------------------------------------------
        AVOID
        ----------------------------------------------------------
        - Markdown lint feedback
        - Cosmetic wording suggestions
        - Large-scale restructuring proposals without strong justification


    # --- SDK USERS DOCS ---
    - path: "docs/contributing/**"
      instructions: |
        These documents are for end users of the Hiero C++ SDK.

        ----------------------------------------------------------
        PRIORITY 1 — HIGH-LEVEL GUIDANCE
        ----------------------------------------------------------
        - Explanations must be conceptual and beginner-friendly
        - Point users to /examples for runnable code
        - Clearly state required environment variables and network setup

        ----------------------------------------------------------
        PRIORITY 2 — NO HIDDEN ASSUMPTIONS
        ----------------------------------------------------------
        - Assume minimal C++ and Hedera knowledge
        - Do NOT assume repo structure knowledge
        - Avoid contributor-only terminology

        ----------------------------------------------------------
        PHILOSOPHY
        ----------------------------------------------------------
        - Keep documentation accessible
        - Focus on “what users need to do”, not internal design


    # --- SDK DEVELOPERS DOCS ---
    - path: "docs/maintainers/**"
      instructions: |
        These documents are for SDK contributors and maintainers.

        ----------------------------------------------------------
        PRIORITY 1 — WORKFLOW ACCURACY
        ----------------------------------------------------------
        - Ensure git workflows, CI, testing, signing (DCO/GPG), and build steps match repo reality
        - Validate references to scripts, tooling, and directories

        ----------------------------------------------------------
        PRIORITY 2 — TRAINING FLOW
        ----------------------------------------------------------
        - Ensure training materials follow a logical progression
        - Cross-links between modules must be valid and consistent

        ----------------------------------------------------------
        PHILOSOPHY
        ----------------------------------------------------------
        - Help developers go from “cloned repo” → “productive contributor”
        - Balance clarity for beginners with technical accuracy for experts

    # --- CUSTOM INSTRUCTIONS FOR .GITHUB DIRECTORY ---
    - path: ".github/workflows/**/*"
      instructions: |
        You are reviewing GitHub Actions workflows as a thoughtful senior
        engineer. Your goal is to nudge contributors toward higher-quality,
        maintainable workflows — not to impose a rigid checklist.

        ---------------------------------------------------------
        SECURITY ESSENTIALS
        ---------------------------------------------------------
        These are firm expectations for every workflow:

        - All third-party actions must be pinned to full commit SHAs,
          consistent with other workflows in this repository.
        - `permissions:` must be explicitly declared and scoped to the
          minimum needed. Flag over-permissioned or under-permissioned
          workflows, and any reliance on broad default permissions.
        - Workflows must not request `contents: write` unless strictly
          required.
        - Workflows must behave safely when executed from forks.
        - Treat all GitHub event data as potentially untrusted input:
          issue titles, bodies, comments, labels, usernames, branch
          names. Prefer strict allowlists or exact string matches.
          Free-form user input must not flow directly into shell
          commands, `gh` CLI arguments, or Node.js exec/spawn calls.

        ---------------------------------------------------------
        CLARITY & CODE ORGANIZATION
        ---------------------------------------------------------
        Each workflow should have a single, clearly defined objective.
        YAML should orchestrate execution — not implement business
        logic.

        - Non-trivial logic belongs in dedicated scripts under
          `.github/scripts/`, keeping the workflow YAML focused on
          orchestration.
        - Environment variables should be defined in the YAML and
          passed to scripts, not hardcoded inside scripts.
        - Flag large `run: |` blocks, inline loops or conditionals,
          and API calls embedded directly in YAML steps.

        ---------------------------------------------------------
        DRY-RUN
        ---------------------------------------------------------
        If used, dry-run should be clear, well-logged, and default
        to true on `workflow_dispatch`. It should have a reasonable
        use case and be easy to maintain. Do not flag missing dry-run
        as a blocker.

        ---------------------------------------------------------
        OPERATIONAL QUALITY
        ---------------------------------------------------------
        - Log key decisions and early exits — avoid silent skips.
        - Avoid raw payload dumps and any secret or token leakage.
        - Workflows that mutate state should use concurrency groups
          and duplicate prevention patterns (marker-based comments,
          check-before-create for labels).
        - Assume workflows may run multiple times or be retried.

        ---------------------------------------------------------
        API DISCIPLINE
        ---------------------------------------------------------
        - Prefer reusing data already in the event payload over
          making additional API calls.
        - Prefer aggregated queries and server-side filtering over
          per-entity loops and client-side iteration.
        - Pagination should have reasonable upper bounds.

        ---------------------------------------------------------
        REVIEW SCOPE
        ---------------------------------------------------------
        - Focus feedback on the PR's stated scope.
        - Flag out-of-scope issues as irrelevant and suggest opening
          a separate PR — do not block for them.
        - Do not propose major refactors unless correctness or
          security is affected.

        ---------------------------------------------------------
        BLOCKERS vs SUGGESTIONS
        ---------------------------------------------------------
        - Block only for security, correctness, or firm expectation
          violations.
        - Style and maintainability improvements should be
          non-blocking suggestions.
        - When in doubt, suggest — don't block.


    # ============================================================
    # JAVASCRIPT SCRIPTS
    # ============================================================
    - path: ".github/scripts/**/*.js"
      instructions: |
        Review JavaScript scripts as production-grade CI automation.

        Firm expectations:
        - Validate `context.payload` fields before use.
        - Do not trust free-form text from issues, PRs, or comments.
        - No `eval`, `new Function`, or dynamic code execution.
        - Use top-level constants for configuration — avoid
          hardcoded values scattered through the script.
        - Environment variables should be passed from the workflow
          YAML, not hardcoded in the script.

        Good practices:
        - Wrap async operations in try/catch with contextual errors.
        - Reuse event context data instead of making redundant API
          calls.
        - Use marker-based patterns to prevent duplicate actions.
        - Handle permission failures gracefully.

    - path: "src/hiero_sdk_cpp/query/**/*.{cpp,hpp,h}"
      instructions: *query_review_instructions

    - path: "src/hiero_sdk_cpp/contract/**/*query*.{cpp,hpp,h}"
      instructions: *query_review_instructions

    - path: "src/hiero_sdk_cpp/file/**/*query*.{cpp,hpp,h}"
      instructions: *query_review_instructions

    - path: "src/hiero_sdk_cpp/contract/**"
      instructions: *contract_review_instructions

    # Nodes module — Privileged administrative node lifecycle operations
    - path: "src/hiero_sdk_cpp/nodes/**/*.cpp"
      instructions: *node_review_instructions

    - path: "src/hiero_sdk_cpp/node.cpp"
      instructions: *node_review_instructions

    - path: "src/hiero_sdk_cpp/managed_node_address.cpp"
      instructions: *node_review_instructions

    - path: "src/hiero_sdk_cpp/address_book/**/*.cpp"
      instructions: *node_review_instructions

    - path: "src/hiero_sdk_cpp/file/**/*.cpp"
      instructions: *file_review_instructions


    # ============================================================
    # CONSENSUS MODULE (C++)
    # ============================================================
    - path: "src/hiero_sdk_cpp/consensus/**/*.cpp"
      instructions: |
        You are reviewing C++ files in the `src/hiero_sdk_cpp/consensus/` directory.
        These implement consensus-related transactions and queries for the Hiero SDK.

        NOTE:
        Protobuf schema alignment (field names, types, oneof handling, bytes normalization,
        repeated defaults, and canonical .proto mapping) is already enforced globally.
        Do NOT repeat schema mapping checks here — focus only on consensus-domain concerns.

        ----------------------------------------------------------
        REVIEW PRIORITIES (highest → lowest)
        ----------------------------------------------------------

        1) Protobuf correctness (must-not-break)
        - Validate field names, field numbers, and types against schema.
        - Flag any mismatch as **BLOCKER**.

        2) Serialization / wire-format integrity
        - Ensure correct protobuf message construction and oneof usage.
        - Verify no fields are silently dropped or default-initialized incorrectly.
        - Ensure optional fields use std::optional correctly (NOT default falsy values).
        - Any silent coercion or defaulting that changes signed payload = **BLOCKER**.

        3) Signing / transaction construction
        - Verify transaction body is constructed exactly once.
        - Ensure required fields are validated before freeze/sign.
        - Missing required fields or signing wrong message type = **BLOCKER**.

        ### Chunking safety (TopicMessageSubmitTransaction equivalent)
        - If chunking exists:
          - Ensure safe timestamp arithmetic (no overflow in nanoseconds)
          - Ensure per-chunk transaction IDs are correctly derived
          - Ensure each chunk is independently signed with full signing key set
        - Any risk of unsigned or partially signed chunk = **BLOCKER**

        4) Topic ID handling & validation
        - Validate parsing, checksum/network validation, and protobuf conversion.
        - Ensure exceptions preserve cause (`std::throw_with_nested` or equivalent).
        - Do not lose original error context.
        - Any misrouting risk = **BLOCKER**

        5) Memory safety / defaults / lifetime correctness
        - No use of uninitialized fields.
        - No accidental shared mutable state in static or default arguments.
        - Prefer value semantics or explicit std::optional.
        - Flag hidden shared state bugs as **MAJOR**.

        6) API ergonomics & errors
        - Errors must be descriptive and actionable.
        - Avoid swallowing RPC/precheck errors.
        - Return types must be consistent (no accidental optional/null ambiguity unless intentional).

        ----------------------------------------------------------
        SEVERITY LABELS
        ----------------------------------------------------------
        - **BLOCKER** — correctness, signing, wire-format, or safety risk
        - **MAJOR** — likely bug or behavioral inconsistency
        - **MINOR** — improvement or minor correctness issue
        - **NIT** — style / readability only

